x-postgres-environment: &postgres-environment
  POSTGRES_USER: ${POSTGRES_USER:-fsc}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-fsc}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"

x-fsc-environment: &fsc-environment
  <<: *postgres-environment
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the public HTTPS URL in .env}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random secret of at least 32 characters}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-FSC <fsc@example.com>}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment: *postgres-environment
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: ghcr.io/lucassovre/fsc:migrate
    environment: *postgres-environment
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/lucassovre/fsc:latest
    restart: unless-stopped
    environment: *fsc-environment
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  worker:
    image: ghcr.io/lucassovre/fsc:worker
    restart: unless-stopped
    environment: *fsc-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "--import", "tsx", "scripts/worker-health.ts"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  postgres_data:
