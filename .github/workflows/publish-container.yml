name: Publish containers to GHCR

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      startsWith(github.ref, 'refs/tags/v')
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      startsWith(github.ref, 'refs/tags/v')
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare image tags
        id: image
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "tags<<TAGS"
            echo "${image}:sha-${GITHUB_SHA}"
            if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "${image}:latest"
            elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              version="${GITHUB_REF_NAME//[^a-zA-Z0-9_.-]/-}"
              echo "${image}:${version:0:100}"
            fi
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=WTFPL
          cache-from: type=gha,scope=ghcr
          cache-to: type=gha,mode=max,scope=ghcr
